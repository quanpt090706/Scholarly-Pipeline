# MinIO cho local dev — thay S3 khi chưa lên cloud.
# Chạy: docker compose up -d ; Console: http://localhost:9001 (minioadmin/minioadmin)
services:
  minio:
    image: minio/minio:latest
    container_name: scholarly-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

volumes:
  minio-data:
